[project]
name = "sales-forecast-system"
version = "0.2.0"
description = "Production-oriented sales forecasting system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "requests>=2.32.0",
    "plotly>=5.22.0",
    "streamlit>=1.37.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]
advanced_models = [
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "prophet>=1.1.5",
    "statsmodels>=0.14.2",
    "tensorflow>=2.16.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
